<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Detailing Templates Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Background Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>

    <div class="max-w-5xl w-full z-10">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500">
                Auto Detailing Templates
            </h1>
            <p class="text-gray-400 text-lg md:text-xl">Select a landing page template to preview the live demo.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- Andres Theme -->
            <a href="./Andres/index.html" class="group block p-px rounded-2xl bg-gradient-to-b from-gray-700/50 to-gray-900/50 hover:from-blue-500 hover:to-blue-900 transition-all duration-500 hover:-translate-y-1 hover:shadow-2xl hover:shadow-blue-500/20">
                <div class="bg-gray-900/90 backdrop-blur-sm h-full rounded-2xl p-8 md:p-12 flex flex-col items-center justify-center text-center transition-colors">
                    <h2 class="text-3xl font-bold mb-3 text-white">Andres</h2>
                    <p class="text-gray-400 text-sm uppercase tracking-widest font-semibold">Sleek & Professional</p>
                </div>
            </a>

            <!-- Miller's Theme -->
            <a href="./Millers/index.html" class="group block p-px rounded-2xl bg-gradient-to-b from-gray-700/50 to-gray-900/50 hover:from-red-500 hover:to-red-900 transition-all duration-500 hover:-translate-y-1 hover:shadow-2xl hover:shadow-red-500/20">
                <div class="bg-gray-900/90 backdrop-blur-sm h-full rounded-2xl p-8 md:p-12 flex flex-col items-center justify-center text-center transition-colors">
                    <h2 class="text-3xl font-bold mb-3 text-white">Miller's</h2>
                    <p class="text-gray-400 text-sm uppercase tracking-widest font-semibold">Cinematic & Bold</p>
                </div>
            </a>

            <!-- Ceramix Theme -->
            <a href="./Ceramix/index.html" class="group block p-px rounded-2xl bg-gradient-to-b from-gray-700/50 to-gray-900/50 hover:from-cyan-400 hover:to-cyan-800 transition-all duration-500 hover:-translate-y-1 hover:shadow-2xl hover:shadow-cyan-400/20">
                <div class="bg-gray-900/90 backdrop-blur-sm h-full rounded-2xl p-8 md:p-12 flex flex-col items-center justify-center text-center transition-colors">
                    <h2 class="text-3xl font-bold mb-3 text-white">Ceramix</h2>
                    <p class="text-gray-400 text-sm uppercase tracking-widest font-semibold">Modern & Premium</p>
                </div>
            </a>

            <!-- Martinez Theme -->
            <a href="./Martinez/index.html" class="group block p-px rounded-2xl bg-gradient-to-b from-gray-700/50 to-gray-900/50 hover:from-purple-500 hover:to-purple-900 transition-all duration-500 hover:-translate-y-1 hover:shadow-2xl hover:shadow-purple-500/20">
                <div class="bg-gray-900/90 backdrop-blur-sm h-full rounded-2xl p-8 md:p-12 flex flex-col items-center justify-center text-center transition-colors">
                    <h2 class="text-3xl font-bold mb-3 text-white">Martinez</h2>
                    <p class="text-gray-400 text-sm uppercase tracking-widest font-semibold">Classic & Clean</p>
                </div>
            </a>

            <!-- Construction Theme -->
            <a href="./Construction/index.html" class="group block p-px rounded-2xl bg-gradient-to-b from-gray-700/50 to-gray-900/50 hover:from-orange-500 hover:to-orange-900 transition-all duration-500 hover:-translate-y-1 hover:shadow-2xl hover:shadow-orange-500/20">
                <div class="bg-gray-900/90 backdrop-blur-sm h-full rounded-2xl p-8 md:p-12 flex flex-col items-center justify-center text-center transition-colors">
                    <h2 class="text-3xl font-bold mb-3 text-white">Construction</h2>
                    <p class="text-gray-400 text-sm uppercase tracking-widest font-semibold">Industrial & Rugged</p>
                </div>
            </a>

        </div>
    </div>

</body>
</html>
